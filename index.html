<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Le Petit CERN</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700&family=Quicksand:wght@400;500;600&display=swap');

  :root {
    --sky-top: #cdeaef;
    --sky-mid: #a2d2d9;
    --sky-dusk: #7fb8c4;
    --cream: #f2e9e4;
    --terracotta: #e8734a;
    --terracotta-deep: #c9432b;
    --moss: #6b8f4e;
    --moss-deep: #4f6b39;
    --ink: #2c3b3f;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    font-family: 'Quicksand', sans-serif;
    background: #0e1a1c; /* fallback while video loads */
  }

  /* ---- Faded background video ---- */
  #bg-video {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    opacity: 0.35;
    z-index: 0;
    filter: saturate(0.9);
  }
  .bg-overlay {
    position: fixed;
    inset: 0;
    z-index: 1;
    background: linear-gradient(180deg, rgba(14,26,28,0.35) 0%, rgba(14,26,28,0.55) 100%);
    pointer-events: none;
  }

  /* ---- Ambient floating specks (grass/pollen), purely decorative ---- */
  .speck {
    position: absolute;
    border-radius: 50%;
    background: var(--cream);
    opacity: 0.55;
    animation: drift linear infinite;
    pointer-events: none;
  }
  @keyframes drift {
    from { transform: translateY(0) translateX(0); }
    to   { transform: translateY(-60px) translateX(20px); }
  }

  .stage {
    position: relative;
    z-index: 2;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    text-align: center;
    padding: 24px;
  }


  h1.title {
    font-family: 'Baloo 2', sans-serif;
    font-weight: 700;
    font-size: clamp(32px, 6vw, 52px);
    color: var(--cream);
    margin: 0;
    letter-spacing: 0.5px;
    text-shadow: 0 2px 14px rgba(0,0,0,0.35);
  }
  p.tagline {
    font-family: 'Quicksand', sans-serif;
    font-weight: 500;
    font-size: 15px;
    color: var(--cream);
    opacity: 0.85;
    margin: 4px 0 30px 0;
    letter-spacing: 0.3px;
    text-shadow: 0 1px 8px rgba(0,0,0,0.3);
  }

  #play-btn {
    font-family: 'Baloo 2', sans-serif;
    font-weight: 600;
    font-size: 20px;
    letter-spacing: 1px;
    color: #fff;
    background: linear-gradient(145deg, var(--terracotta), var(--terracotta-deep));
    border: none;
    border-radius: 999px;
    padding: 16px 56px;
    cursor: pointer;
    box-shadow:
      0 8px 0 var(--terracotta-deep),
      0 14px 26px rgba(201, 67, 43, 0.35);
    transition: transform 0.12s ease, box-shadow 0.12s ease;
  }
  #play-btn:hover {
    transform: translateY(-2px);
    box-shadow:
      0 10px 0 var(--terracotta-deep),
      0 18px 30px rgba(201, 67, 43, 0.4);
  }
  #play-btn:active {
    transform: translateY(4px);
    box-shadow:
      0 4px 0 var(--terracotta-deep),
      0 8px 16px rgba(201, 67, 43, 0.3);
  }

  .hint {
    margin-top: 22px;
    font-size: 12px;
    color: var(--cream);
    opacity: 0.65;
    letter-spacing: 0.3px;
    text-shadow: 0 1px 6px rgba(0,0,0,0.3);
  }

  /* ---- Credits button ---- */
  #credits-btn {
    position: fixed;
    top: 20px;
    right: 20px;
    z-index: 3;
    font-family: 'Quicksand', sans-serif;
    font-weight: 600;
    font-size: 13px;
    letter-spacing: 0.5px;
    color: var(--cream);
    background: rgba(0, 0, 0, 0.28);
    border: 1.5px solid rgba(242, 233, 228, 0.4);
    border-radius: 999px;
    padding: 9px 20px;
    cursor: pointer;
    backdrop-filter: blur(4px);
    transition: background 0.15s ease, border-color 0.15s ease;
  }
  #credits-btn:hover {
    background: rgba(0, 0, 0, 0.45);
    border-color: rgba(242, 233, 228, 0.7);
  }

  /* ---- Credits modal ---- */
  #credits-overlay {
    position: fixed;
    inset: 0;
    z-index: 10;
    background: rgba(10, 16, 17, 0.6);
    backdrop-filter: blur(3px);
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease;
  }
  #credits-overlay.open {
    opacity: 1;
    pointer-events: auto;
  }
  #credits-modal {
    position: relative;
    width: min(420px, 88vw);
    max-height: 78vh;
    overflow-y: auto;
    background: linear-gradient(165deg, #fdf9f5, var(--cream));
    border-radius: 18px;
    padding: 30px 28px 26px;
    box-shadow: 0 24px 60px rgba(0,0,0,0.4);
    transform: translateY(10px) scale(0.98);
    transition: transform 0.2s ease;
  }
  #credits-overlay.open #credits-modal {
    transform: translateY(0) scale(1);
  }
  #credits-modal h2 {
    font-family: 'Baloo 2', sans-serif;
    font-weight: 700;
    font-size: 24px;
    color: var(--ink);
    margin: 0 0 16px 0;
    text-align: center;
  }
  #credits-content {
    font-family: 'Quicksand', sans-serif;
    font-size: 14px;
    line-height: 1.7;
    color: var(--ink);
  }
  #credits-content h3 {
    font-family: 'Baloo 2', sans-serif;
    font-size: 14px;
    color: var(--terracotta-deep);
    margin: 16px 0 4px;
    text-transform: uppercase;
    letter-spacing: 0.6px;
  }
  #credits-content h3:first-child { margin-top: 0; }
  #credits-content p { margin: 0 0 2px; opacity: 0.85; }
  #credits-close {
    position: absolute;
    top: 14px;
    right: 14px;
    width: 30px;
    height: 30px;
    border-radius: 50%;
    border: none;
    background: rgba(44, 59, 63, 0.08);
    color: var(--ink);
    font-size: 15px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s ease;
  }
  #credits-close:hover { background: rgba(44, 59, 63, 0.18); }

  @media (prefers-reduced-motion: reduce) {
    .speck { animation: none !important; }
  }
</style>
</head>
<body>

<!-- Set your video source below -->
<video id="bg-video" autoplay muted loop playsinline>
  <source src="video.mp4" type="video/mp4">
</video>
<div class="bg-overlay"></div>

<button id="credits-btn">Credits</button>

<div class="stage" id="stage">

  <h1 class="title">Le Petit CERN</h1>
  <p class="tagline">Experience the CERN, but in a cozy way.</p>

  <button id="play-btn">Play</button>

  <div class="hint">
    For the best experience, kindly open in full window (F11) and keep the volume up. Thank You. 
  </div>

</div>

<!-- Credits modal -->
<div id="credits-overlay">
  <div id="credits-modal">
    <button id="credits-close" aria-label="Close credits">✕</button>
    <h2>Credits</h2>
    <div id="credits-content">
      <!-- Replace this block with your own credits -->
      <h3>Created By</h3>
      <p>Aerdite</p>

      <h3>Music &amp; Sound</h3>
      <p>Aerdite/p4nmusic</p>

      <h3>Special Thanks</h3>
      <p>Aerdite ofc</p>
    </div>
  </div>
</div>

<script>
  // ---- Set your game link here ----
  const GAME_URL = "https://aerditee-hub.github.io/LePetitCERN/";

  document.getElementById('play-btn').addEventListener('click', () => {
    window.location.href = GAME_URL;
  });

  // ---- Credits modal open/close ----
  const creditsBtn = document.getElementById('credits-btn');
  const creditsOverlay = document.getElementById('credits-overlay');
  const creditsClose = document.getElementById('credits-close');

  creditsBtn.addEventListener('click', () => creditsOverlay.classList.add('open'));
  creditsClose.addEventListener('click', () => creditsOverlay.classList.remove('open'));
  creditsOverlay.addEventListener('click', (e) => {
    if (e.target === creditsOverlay) creditsOverlay.classList.remove('open');
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') creditsOverlay.classList.remove('open');
  });

  // ---- Ambient floating specks ----
  const stage = document.getElementById('stage');
  const speckCount = 14;
  for (let i = 0; i < speckCount; i++) {
    const s = document.createElement('div');
    s.className = 'speck';
    const size = 3 + Math.random() * 4;
    s.style.width = size + 'px';
    s.style.height = size + 'px';
    s.style.left = Math.random() * 100 + '%';
    s.style.top = 40 + Math.random() * 55 + '%';
    s.style.animationDuration = (6 + Math.random() * 8) + 's';
    s.style.animationDelay = (Math.random() * 6) + 's';
    stage.appendChild(s);
  }
</script>

</body>
</html>
